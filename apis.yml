name: Lucidum
description: 'Lucidum is a cyber asset and security data platform (CAASM) that ingests, correlates,
  and enriches data from more than 500 sources to give security and IT teams a unified inventory of
  assets, identities, data, and their relationships. The Security Data Fabric platform eliminates
  blind spots by connecting to existing SIEM, cloud, endpoint, and identity systems without extra
  ingestion charges, and surfaces unseen systems and accounts for exposure and attack-surface
  management. Lucidum was acquired by Cyderes and its capabilities are now delivered as part of the
  Cyderes "Meridian" platform. This profile originated as a GGV Capital portfolio lead and was
  enriched from Lucidum public web surface; the company publishes no public developer API.'
